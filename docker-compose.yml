services:
  db-cvinsight:
    image: postgres:16
    container_name: db-cvinsight
    restart: always
    env_file:
      - .env.fastapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-cvinsight-app:
    image: us-central1-docker.pkg.dev/ridwan-faturrahman/api-cvinsight-repo/api-cvinsight-app:latest
    container_name: api-cvinsight-app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.fastapi
    depends_on:
      db-cvinsight:
        condition: service_healthy

volumes:
  postgres_data: